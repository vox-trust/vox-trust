# cargo-deny: supply-chain policy for dependencies (run by CI).
[graph]
all-features = false

[advisories]
# RustSec advisory database. Unmaintained crates are reported as well.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences compatible with Apache-2.0 distribution; the list holds only the
# licences in use, so a new one needs a deliberate decision.
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
