[workspace]
resolver = "2"
members = ["crates/vox-trust-core", "crates/vox-trust-wasm", "crates/vox-trust-cli", "crates/vox-trust-carrier", "crates/vox-trust-bench"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/vox-trust/vox-trust"
authors = ["Roger Oliveira"]
homepage = "https://vox-trust.github.io"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Key derivation is deliberately expensive; keep it fast in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
