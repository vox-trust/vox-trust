[package]
name = "vox-trust-ffi"
description = "Kotlin, Swift and Python bindings for the Vox Trust protocol (UniFFI). Pre-1.0, not audited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "vox_trust_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
vox-trust-core = { path = "../../crates/vox-trust-core", version = "0.6.0" }
uniffi = { version = "0.32.2", features = ["cli"] }
thiserror = "2"
