name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests, vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check && rustfmt --edition 2021 --check fuzz/fuzz_targets/*.rs
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --locked

  other-os:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Test
        run: cargo test --workspace --locked

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Coverage (fails below the floor set in scripts/coverage.sh)
        run: scripts/coverage.sh

  msrv:
    name: Minimum supported Rust (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.94"
      - name: Test on exactly 1.94 (rust-toolchain.toml would otherwise select stable)
        run: cargo +1.94 test --workspace --locked

  audit:
    name: Dependency advisories and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit cargo-deny
      - name: RustSec advisories
        run: cargo audit
      - name: Licences, banned crates, sources (deny.toml)
        run: cargo deny --locked check

  independent-check:
    name: Independent vector check and WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Independent re-implementation of the test vectors (Python)
        run: |
          pip install cryptography argon2-cffi pycryptodome
          python3 tools/check_vectors.py --strict
          python3 tools/keyfile_kat.py
      - name: Build the WebAssembly core and the npm package
        run: |
          scripts/build-web.sh
          scripts/build-npm.sh
      - name: WebAssembly end-to-end tests and the packed npm package (Node)
        run: node --test tests/node/*.mjs
      - name: The core crate packages for crates.io
        run: cargo publish --dry-run --locked -p vox-trust-core

  browser:
    name: Demo in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # webkit is the engine behind Safari.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the WebAssembly core
        run: scripts/build-web.sh
      - name: Install Playwright and the browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Drive the demo page
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/browser/demo.mjs
