[package]
name = "vox-trust-cli"
description = "Command-line tool to seal and verify WAV files with the Vox Trust protocol (file mode)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["voice", "authenticity", "provenance", "cli", "audio"]
categories = ["command-line-utilities", "cryptography", "multimedia::audio"]

[[bin]]
name = "vox-trust"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
rpassword = "7.5.4"
zeroize = "1"
vox-trust-core = { path = "../vox-trust-core", version = "0.6.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
