[package]
name = "vox-trust-core"
description = "Reference implementation of the Vox Trust protocol: sealed WAV files (HMAC-SHA-256 or Ed25519), seal layout, trust policy. Draft, not audited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/vox-trust-core"
keywords = ["voice", "authenticity", "provenance", "deepfake", "protocol"]
categories = ["cryptography", "multimedia::audio"]

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
hmac = "0.13.0"
sha2 = "0.11.0"
zeroize = "1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.151"

[[bench]]
name = "file_mode"
harness = false
