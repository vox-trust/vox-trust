[package]
name = "vox-trust-core"
description = "Seal layout and trust-policy logic for the Vox Trust protocol (pre-alpha, no cryptography or audio yet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["voice", "authenticity", "provenance", "deepfake", "protocol"]
categories = ["cryptography", "multimedia::audio"]

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
serde_json = "1.0.151"
