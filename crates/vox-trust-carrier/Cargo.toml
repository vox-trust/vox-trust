[package]
name = "vox-trust-carrier"
description = "Experimental in-band audio watermark for Vox Trust seals (stdm-2: spread-transform dither modulation on log-spectral tiles). Measured, research only, not audited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["audio", "watermark", "watermarking", "provenance", "voice"]
categories = ["multimedia::audio"]

[dependencies]
realfft = "3.5.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
vox-trust-core = { path = "../vox-trust-core", version = "0.5.1" }

[[bench]]
name = "carrier"
harness = false
